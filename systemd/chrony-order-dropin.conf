# 装到 | install to: /etc/systemd/system/chrony.service.d/m20-order.conf
# chrony 的 refclock 是 /dev/ptp1(eth1 的 PHC),它随 eth1 驱动出现;库存单元只有
# After=network.target,开机必然竞速 → 首次启动死于 "Could not open PHC"(留下一次
# 无谓的 flap,同步也被推迟 5s)。按设备单元排序后首启即成功。
# chrony's refclock is /dev/ptp1 (eth1's PHC), which appears with the eth1
# driver. The stock unit orders only After=network.target and loses that race —
# its first start dies with "Could not open PHC" (a pointless flap, and sync is
# delayed by RestartSec). Ordering on the device unit makes the first start win.
[Unit]
After=sys-subsystem-net-devices-eth1.device
Wants=sys-subsystem-net-devices-eth1.device
