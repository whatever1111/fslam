# Drop-in for the OEM handler.service — install as:
#   /etc/systemd/system/handler.service.d/dds.conf   (then systemctl daemon-reload
#   && systemctl restart handler)
# Forces handler onto UDP-only Fast DDS: cross-version SHM (our Foxy 2.1.x
# publishers vs handler's 2.14) silently drops ~1 MB-class samples (/cloud_nav),
# starving the handler safety gate -> 0x312. See config/fixposition/
# fastdds_handler_udp.xml for the full rationale. Managed by /home/user/fslam.
[Service]
Environment=FASTRTPS_DEFAULT_PROFILES_FILE=/home/user/fslam/config/fixposition/fastdds_handler_udp.xml
