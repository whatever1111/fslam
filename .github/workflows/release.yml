name: release

# 通用模板(main 分支)。真正的打包逻辑在各产品分支的这份文件里 —— tag 触发时
# 跑的是 tag 所在 commit 上的 workflow,main 的这份永远不该被 tag 命中。
# Generic template (main). Real packaging lives in each product branch's copy of
# this file — a tag runs the workflow AT THE TAGGED COMMIT, and no tag should
# ever point at main.
#
# tag 格式 | tag format: <vendor>-<robot>-<distro>-v<X.Y.Z>
# 资产命名 | asset naming: <mode>_<ver>_[<distro>_]arm64[...] ,mode ∈ {rtk_only, fslam}

on:
  push:
    tags:
      - '*-v[0-9]*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Resolve target, distro, version
        id: rv
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag##*-v}"
          base="${tag%-v${version}}"
          distro="${base##*-}"
          target="${base%-${distro}}"
          case "${distro}" in
            foxy|humble|jazzy) ;;
            *) echo "::error::cannot parse distro from tag '${tag}' (want <target>-<distro>-vX.Y.Z)"; exit 1 ;;
          esac
          echo "target=${target}"   >> "${GITHUB_OUTPUT}"
          echo "distro=${distro}"   >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: No packaging on main
        run: |
          echo "::error::this is the generic template on main — packaging steps live on the product branch (tag its commit, not main's)"
          exit 1
