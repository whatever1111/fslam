name: release

# deep-robotics-m20 的发布流水线:一个 release 同时交付两个模式的工具链。
# Release pipeline for deep-robotics-m20: one release ships both mode toolchains.
#
#   rtk_only : fork 驱动二进制(DRIVER_RELEASE 钉版,下载 + 核 SHA256)
#              native 捆绑包(driver/ + fslam/)+ docker 镜像(driver 镜像 + 烘焙配置)
#   fslam    : 部署层捆绑包(启动脚本/宿主节点/配置/unit);镜像由 SLAM_IMAGE 钉版,
#              但在私有 registry,**不随发布分发** —— 公开它的决定不归流水线做。
#              The SLAM image is pinned by SLAM_IMAGE but lives in a private
#              registry and is NOT attached — publishing it is not the pipeline's call.
#
# tag 格式 | tag format: deep-robotics-m20-<distro>-v<X.Y.Z>(打在发行版叶子分支上)
#   git tag deep-robotics-m20-foxy-v1.2.0 deep-robotics-m20-foxy
#   git push origin deep-robotics-m20-foxy-v1.2.0
#
# 资产 | assets(命名规则:<mode>_<ver>_[<distro>_]arm64[...]):
#   - rtk_only_<ver>_<distro>_arm64.tar.gz               rtk_only native 捆绑包
#   - rtk_only_<ver>_<distro>_arm64_docker-image.tar.gz  rtk_only docker 镜像
#   - fslam_<ver>_arm64.tar.gz                           fslam 部署层捆绑包
#   - SHA256SUMS.txt
# rtk_only 镜像另推 ghcr.io/<owner>/rtk_only:<distro>-<ver>。
# 无源码审计:rtk_only 资产禁 C/C++/头文件/python;fslam 捆绑包禁 C/C++/头文件
# (host/*.py 是本仓库自己的公开部署胶水,随包分发)。

on:
  push:
    tags:
      - 'deep-robotics-m20-*-v[0-9]*'
  workflow_dispatch:
    inputs:
      distro:
        description: 'ROS 2 distro'
        required: true
        type: choice
        options:
          - foxy
          - humble
      version:
        description: 'Version (X.Y.Z) — the tag/release becomes deep-robotics-m20-<distro>-v<version>'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Resolve target, distro, version, image name
        id: rv
        env:
          IN_DISTRO: ${{ inputs.distro }}
          IN_VERSION: ${{ inputs.version }}
        run: |
          target="deep-robotics-m20"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            distro="${IN_DISTRO}"
            version="${IN_VERSION}"
          else
            tag="${GITHUB_REF_NAME}"
            version="${tag##*-v}"
            base="${tag%-v${version}}"          # deep-robotics-m20-<distro>
            distro="${base##*-}"
          fi
          case "${distro}" in
            foxy|humble|jazzy) ;;
            *) echo "::error::cannot parse distro from '${GITHUB_REF_NAME}' (want ${target}-<distro>-vX.Y.Z)"; exit 1 ;;
          esac
          echo "target=${target}"                    >> "${GITHUB_OUTPUT}"
          echo "distro=${distro}"                    >> "${GITHUB_OUTPUT}"
          echo "version=${version}"                  >> "${GITHUB_OUTPUT}"
          echo "tag=${target}-${distro}-v${version}" >> "${GITHUB_OUTPUT}"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rtk_only" >> "${GITHUB_OUTPUT}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch pinned driver release (verify SHA256)
        id: drv
        env:
          DISTRO: ${{ steps.rv.outputs.distro }}
        run: |
          if [ ! -f DRIVER_RELEASE ]; then
            echo "::error::DRIVER_RELEASE file missing on this branch — it must pin the driver release tag (e.g. foxy-v1.0.1)"
            exit 1
          fi
          driver_tag="$(tr -d '[:space:]' < DRIVER_RELEASE)"
          case "${driver_tag}" in
            "${DISTRO}-v"*) ;;
            *) echo "::error::DRIVER_RELEASE '${driver_tag}' does not match distro '${DISTRO}'"; exit 1 ;;
          esac
          dver="${driver_tag#*-v}"
          base="https://github.com/whatever1111/fixposition_driver/releases/download/${driver_tag}"
          mkdir -p dl
          curl -fsSL -o "dl/fixposition-driver-m20_${dver}_${DISTRO}_arm64.tar.gz" \
            "${base}/fixposition-driver-m20_${dver}_${DISTRO}_arm64.tar.gz"
          curl -fsSL -o "dl/fixposition-driver-m20_${dver}_${DISTRO}_arm64_docker-image.tar.gz" \
            "${base}/fixposition-driver-m20_${dver}_${DISTRO}_arm64_docker-image.tar.gz"
          curl -fsSL -o dl/SHA256SUMS.txt "${base}/SHA256SUMS.txt"
          ( cd dl && sha256sum -c SHA256SUMS.txt )
          echo "driver_tag=${driver_tag}" >> "${GITHUB_OUTPUT}"
          echo "dver=${dver}"             >> "${GITHUB_OUTPUT}"

      - name: Assemble rtk_only native bundle
        env:
          DISTRO: ${{ steps.rv.outputs.distro }}
          VERSION: ${{ steps.rv.outputs.version }}
          DRIVER_TAG: ${{ steps.drv.outputs.driver_tag }}
          DVER: ${{ steps.drv.outputs.dver }}
        run: |
          if [ "${DISTRO}" != "foxy" ]; then
            echo "::error::rtk_only bundle assembly for '${DISTRO}' is not wired yet (only foxy)"
            exit 1
          fi
          root="bundle-rtk/rtk_only-${DISTRO}"
          mkdir -p "${root}/fslam/lib" "${root}/fslam/config/fixposition" "${root}/fslam/systemd"
          tar -xzf "dl/fixposition-driver-m20_${DVER}_${DISTRO}_arm64.tar.gz" -C "${root}"
          mv "${root}/fixposition-driver-m20" "${root}/driver"
          cp run_rtk_only_native.sh                 "${root}/fslam/"
          cp lib/deploy_common.sh                   "${root}/fslam/lib/"
          cp config/fixposition/config_m20.yaml     "${root}/fslam/config/fixposition/"
          cp config/fixposition/robot.urdf          "${root}/fslam/config/fixposition/"
          cp systemd/rtk_only.service               "${root}/fslam/systemd/"
          {
            echo "# rtk_only native bundle (deep-robotics-m20 ${VERSION}, driver ${DRIVER_TAG}, ${DISTRO})"
            echo
            echo "Mode rtk_only, form native: the forked driver delivers the OEM three-topic"
            echo "contract on its own. Run in place (driver/ is a drop-in WS):"
            echo
            echo '```bash'
            echo "WS=\"\$(pwd)/driver\" ./fslam/run_rtk_only_native.sh"
            echo '```'
            echo
            echo "As a service: install fslam/systemd/rtk_only.service and override its paths"
            echo "with a drop-in:"
            echo
            echo '```ini'
            echo "# /etc/systemd/system/rtk_only.service.d/bundle.conf"
            echo "[Service]"
            echo "Environment=WS=/path/to/bundle/driver"
            echo "ExecStart="
            echo "ExecStart=/bin/bash /path/to/bundle/fslam/run_rtk_only_native.sh"
            echo '```'
            echo
            echo "Foxy notes: the driver tree ships no drdds (the robot's system drdds is used)"
            echo "and no python typesupport (no 'ros2 topic echo' of fixposition custom msgs)."
          } > "${root}/README.md"

      - name: No-source audit (rtk_only bundle)
        run: |
          bad="$(find bundle-rtk \( -type d -name include \) -print -o \
            \( -type f \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' \
               -o -name '*.h' -o -name '*.hpp' -o -name '*.hh' -o -name '*.hxx' \) \) -print -o \
            \( -type f -name '*.py' ! -name '_local_setup_util*' \) -print)"
          if [ -n "${bad}" ]; then
            echo "::error::source files found in the rtk_only bundle:"
            echo "${bad}"
            exit 1
          fi
          echo "rtk_only bundle audit clean"

      - name: Assemble fslam bundle (deployment layer; image pinned, not shipped)
        id: slam
        env:
          VERSION: ${{ steps.rv.outputs.version }}
        run: |
          if [ ! -f SLAM_IMAGE ]; then
            echo "::error::SLAM_IMAGE file missing — it must pin the LIO-SLAM image (e.g. wanderer123/fslam-humble:arm64)"
            exit 1
          fi
          slam_image="$(tr -d '[:space:]' < SLAM_IMAGE)"
          root="bundle-fslam/fslam"
          mkdir -p "${root}/lib" "${root}/host" "${root}/systemd" "${root}/config"
          # 布局镜像仓库根,BASE_DIR 相对路径才成立 | mirror the repo root so the
          # launcher's BASE_DIR-relative paths keep working
          cp run_fslam.sh                  "${root}/"
          cp lib/deploy_common.sh          "${root}/lib/"
          cp host/fp_to_odom.py            "${root}/host/"
          cp host/motion_info_to_twist.py  "${root}/host/"
          cp -r container                  "${root}/container"
          cp -r config/dds config/slam config/fixposition "${root}/config/"
          cp systemd/fslam.service         "${root}/systemd/"
          cp SLAM_IMAGE                    "${root}/"
          {
            echo "# fslam bundle (deep-robotics-m20 ${VERSION})"
            echo
            echo "Mode fslam, form docker: LIO-SLAM (FAST-LIO + PGO) in a Humble container with"
            echo "its internal upstream fixposition driver, plus host-side glue nodes."
            echo
            echo "Pinned image: ${slam_image} (see SLAM_IMAGE)."
            echo "The image is NOT part of this release — it lives in a private registry."
            echo "Ship it to an offline robot from any machine with registry access:"
            echo
            echo '```bash'
            echo "docker pull ${slam_image}"
            echo "docker save ${slam_image} | gzip > slam_image.tar.gz"
            echo "scp slam_image.tar.gz robot:/home/user/ && ssh robot 'docker load < /home/user/slam_image.tar.gz'"
            echo '```'
            echo
            echo "Run (repo-root layout is preserved, so the launcher works in place):"
            echo
            echo '```bash'
            echo "./run_fslam.sh --image ${slam_image}"
            echo "./run_fslam.sh --check     # verify the running deployment"
            echo '```'
            echo
            echo "As a service: install systemd/fslam.service (adjust ExecStart if the bundle"
            echo "is not at /home/user/fslam). It conflicts with the rtk_only units — every"
            echo "localization mode publishes /ODOM and only one may run."
          } > "${root}/README.md"
          echo "slam_image=${slam_image}" >> "${GITHUB_OUTPUT}"

      - name: No-source audit (fslam bundle)
        run: |
          # host/*.py 是本仓库公开的部署胶水,允许;C/C++/头文件仍然禁止。
          # host/*.py is this repo's own public deployment glue and is allowed;
          # C/C++ sources and headers are still forbidden.
          bad="$(find bundle-fslam \( -type d -name include \) -print -o \
            \( -type f \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' \
               -o -name '*.h' -o -name '*.hpp' -o -name '*.hh' -o -name '*.hxx' \) \) -print)"
          if [ -n "${bad}" ]; then
            echo "::error::C/C++ source or headers found in the fslam bundle:"
            echo "${bad}"
            exit 1
          fi
          echo "fslam bundle audit clean"

      - name: Build rtk_only docker image on the driver release image
        env:
          DISTRO: ${{ steps.rv.outputs.distro }}
          VERSION: ${{ steps.rv.outputs.version }}
          DVER: ${{ steps.drv.outputs.dver }}
          IMAGE: ${{ steps.rv.outputs.image }}
        run: |
          docker load < "dl/fixposition-driver-m20_${DVER}_${DISTRO}_arm64_docker-image.tar.gz"
          base_tag="$(docker images --format '{{.Repository}}:{{.Tag}}' | grep "fixposition-driver-m20:${DISTRO}-${DVER}" | head -1)"
          test -n "${base_tag}"
          docker build -f release/Dockerfile \
            --build-arg BASE_IMAGE="${base_tag}" \
            -t "${IMAGE}:${DISTRO}-${VERSION}" \
            -t "${IMAGE}:${DISTRO}-latest" .

      - name: No-source audit (rtk_only image)
        env:
          DISTRO: ${{ steps.rv.outputs.distro }}
          VERSION: ${{ steps.rv.outputs.version }}
          IMAGE: ${{ steps.rv.outputs.image }}
        run: |
          bad="$(docker run --rm --entrypoint /usr/bin/find "${IMAGE}:${DISTRO}-${VERSION}" \
            /opt/fixposition /config \
            \( -type d -name include \) -print -o \
            \( -type f \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' \
               -o -name '*.h' -o -name '*.hpp' -o -name '*.hh' -o -name '*.hxx' \) \) -print -o \
            \( -type f -name '*.py' ! -name '_local_setup_util*' \) -print)"
          if [ -n "${bad}" ]; then
            echo "::error::source files found in the rtk_only image:"
            echo "${bad}"
            exit 1
          fi
          echo "rtk_only image audit clean"

      - name: Pack assets
        env:
          DISTRO: ${{ steps.rv.outputs.distro }}
          VERSION: ${{ steps.rv.outputs.version }}
          IMAGE: ${{ steps.rv.outputs.image }}
        run: |
          mkdir -p out
          tar -C bundle-rtk   -czf "out/rtk_only_${VERSION}_${DISTRO}_arm64.tar.gz" "rtk_only-${DISTRO}"
          tar -C bundle-fslam -czf "out/fslam_${VERSION}_arm64.tar.gz" "fslam"
          docker save "${IMAGE}:${DISTRO}-${VERSION}" | gzip \
            > "out/rtk_only_${VERSION}_${DISTRO}_arm64_docker-image.tar.gz"
          ( cd out && sha256sum ./* > SHA256SUMS.txt && cat SHA256SUMS.txt )

      - name: Push rtk_only image to ghcr.io
        env:
          DISTRO: ${{ steps.rv.outputs.distro }}
          VERSION: ${{ steps.rv.outputs.version }}
          IMAGE: ${{ steps.rv.outputs.image }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker push "${IMAGE}:${DISTRO}-${VERSION}"
          docker push "${IMAGE}:${DISTRO}-latest"

      - name: Create GitHub release
        env:
          DISTRO: ${{ steps.rv.outputs.distro }}
          VERSION: ${{ steps.rv.outputs.version }}
          TAG: ${{ steps.rv.outputs.tag }}
          IMAGE: ${{ steps.rv.outputs.image }}
          DRIVER_TAG: ${{ steps.drv.outputs.driver_tag }}
          SLAM_IMAGE_REF: ${{ steps.slam.outputs.slam_image }}
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "deep-robotics-m20 localization deployment (arm64, ${DISTRO}) — both modes in one release."
            echo
            echo "| mode | form | binaries from | asset |"
            echo "|---|---|---|---|"
            echo "| **rtk_only** | native | driver release **${DRIVER_TAG}** (SHA256-verified, no source) | \`rtk_only_${VERSION}_${DISTRO}_arm64.tar.gz\` |"
            echo "| **rtk_only** | docker | same, config baked | \`..._docker-image.tar.gz\` / \`${IMAGE}:${DISTRO}-${VERSION}\` |"
            echo "| **fslam** | docker | pinned image \`${SLAM_IMAGE_REF}\` (private registry, **not attached**) | \`fslam_${VERSION}_arm64.tar.gz\` (deployment layer) |"
            echo
            echo "## rtk_only · native"
            echo '```bash'
            echo "tar -xzf rtk_only_${VERSION}_${DISTRO}_arm64.tar.gz && cd rtk_only-${DISTRO}"
            echo "WS=\"\$(pwd)/driver\" ./fslam/run_rtk_only_native.sh"
            echo '```'
            echo
            echo "## rtk_only · docker"
            echo '```bash'
            echo "docker load < rtk_only_${VERSION}_${DISTRO}_arm64_docker-image.tar.gz"
            echo "docker run -d --name rtk_only --restart unless-stopped \\"
            echo "    --network host -v /dev/shm:/dev/shm ${IMAGE}:${DISTRO}-${VERSION}"
            echo '```'
            echo
            echo "## fslam · docker"
            echo '```bash'
            echo "tar -xzf fslam_${VERSION}_arm64.tar.gz && cd fslam"
            echo "# image ships separately (private registry) — see the bundle README"
            echo "./run_fslam.sh --image ${SLAM_IMAGE_REF}"
            echo '```'
            echo
            echo "Only one localization mode may run at a time — every mode publishes /ODOM."
            echo "Docker on the M20 robot: --network host (or none) only, plus -v /dev/shm:/dev/shm."
          } > notes.md
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "deep-robotics-m20 ${DISTRO} v${VERSION} (rtk_only + fslam)" \
            --notes-file notes.md \
            out/*
